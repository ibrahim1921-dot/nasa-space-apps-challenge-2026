services:
  postgres:
    image: postgres:17
    container_name: astrohealth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: astrohealth
      POSTGRES_USER: astrohealth_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - astrohealth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astrohealth_app -d astrohealth"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  astrohealth_pgdata:
