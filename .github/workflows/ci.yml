name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Skip until frontend exists
        id: present
        working-directory: .
        run: echo "ok=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.present.outputs.ok == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.present.outputs.ok == 'true'
        run: npm ci
      - if: steps.present.outputs.ok == 'true'
        run: npm run lint --if-present
      - if: steps.present.outputs.ok == 'true'
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip until backend exists
        id: present
        run: echo "ok=$([ -f backend/pom.xml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        if: steps.present.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - if: steps.present.outputs.ok == 'true'
        run: mvn -B -f backend/pom.xml verify

  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Tests (none yet is fine)
        run: pytest -q || [ $? -eq 5 ]
